<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I O U - Sell Paper, Become Liquid</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe4;--ink:#1f2b24;--dim:#7f8471;--green:#2e7d4f;--line:#ddd5bf;--card:#fdfbf3}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:46px 16px 64px}
h1{font-family:'Rozha One',serif;font-size:44px;font-weight:400;letter-spacing:6px;color:var(--green)}
.sub{color:var(--dim);font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;margin-top:6px;text-align:center}
#hud{margin:22px 0 6px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);text-align:center;line-height:2}
#hud b{color:var(--green);margin:0 2px}
#buyer{width:min(560px,94vw);margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;border-bottom:4px double var(--green);padding:22px 26px;font-size:14.5px;line-height:1.7;min-height:84px}
#buyer b{color:var(--green)}
#choices{display:grid;gap:8px;width:min(560px,94vw);margin-top:12px}
#choices button{cursor:pointer;text-align:left;padding:13px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:13.5px;transition:all .15s}
#choices button small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
#choices button:hover{border-color:var(--green);color:var(--green)}
#log{width:min(560px,94vw);margin-top:16px;font-size:12.5px;color:var(--dim);line-height:1.9;border-top:1px solid var(--line);padding-top:12px}
#log:empty{display:none}
#log b{color:var(--ink)}
#overlay{position:fixed;inset:0;background:rgba(24,34,27,.93);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;z-index:20}
#overlay.show{display:flex}
#overlay h2{font-family:'Rozha One',serif;font-size:32px;letter-spacing:2px;color:#bfe3cd;font-weight:400}
#overlay p{color:#9db5a6;max-width:440px;line-height:1.7;font-size:14px}
#again{cursor:pointer;padding:13px 28px;border-radius:999px;border:2px solid #bfe3cd;background:transparent;color:#bfe3cd;font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
#again:hover{background:#bfe3cd;color:#1f2b24}
</style>
</head>
<body>
<h1>I O U</h1>
<div class="sub">the game where you sell IOUs &middot; 10 buyers &middot; become liquid</div>
<div id="hud">Cash <b id="cash">$0</b> &middot; Credibility <b id="cred">60</b>% &middot; Debts due <b id="debt">$0</b> &middot; Buyer <b id="n">1</b>/10</div>
<div id="buyer"></div>
<div id="choices"></div>
<div id="log"></div>
<div id="overlay"><h2 id="ovT"></h2><p id="ovB"></p><button id="again">ISSUE MORE PAPER</button></div>
<script>
const BUYERS=[
 ['Retirement-age neighbor','wants "a safe little yield"',1.0],
 ['Crypto guy at the gym','asks about APY before hello',1.6],
 ['Your cousin Dale','will buy anything you sell',0.8],
 ['Local pawn broker','has seen every trick',2.2],
 ['Bored venture capitalist','collects exotic risk',2.6],
 ['High-school buddy','trusts you completely, unfortunately',0.7],
 ['Farmer with cash in a tin','wants something paper-y',1.2],
 ['Day trader','will flip your IOU by lunch',1.8],
 ['Retired math teacher','will check your math',2.0],
 ['A raccoon (somehow)','payment in shiny objects',0.5],
];
const S={cash:0,cred:60,debt:0,i:0,over:false};
const $=id=>document.getElementById(id);
const log=(m,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=m;$('log').prepend(d);};
function hud(){$('cash').textContent='$'+S.cash;$('cred').textContent=S.cred;$('debt').textContent='$'+S.debt;$('n').textContent=Math.min(S.i+1,10);}
function next(){
  if(S.i>=10)return end();
  const b=BUYERS[S.i];
  $('buyer').innerHTML='<b>'+b[0]+'</b> approaches. '+b[1]+'. What do you promise them?';
  const box=$('choices');box.innerHTML='';
  [['Honest IOU: pay back 110% in a month','safe sale, small margin',110],
   ['Spicy IOU: pay back 150% "guaranteed"','bigger sale, credibility check',150],
   ['Full Ponzi: 300% returns, vibes-based','max cash now, big credibility risk',300]].forEach(o=>{
    const btn=document.createElement('button');
    btn.innerHTML=o[0]+'<small>'+o[1]+'</small>';
    btn.onclick=()=>sell(b,o[2]);
    box.appendChild(btn);
  });
  hud();
}
function sell(b,pct){
  const face=Math.round((30+Math.random()*50)*b[2]*(S.cred/60));
  const payoff=Math.round(face*pct/100);
  let roll=Math.random()*100;
  if(pct===110){S.cred=Math.min(100,S.cred+4);}
  else if(pct===150){if(roll>S.cred+20){S.cred=Math.max(0,S.cred-12);log(b[0]+' got suspicious but signed anyway. Credibility hit.','lose');}}
  else{if(roll>S.cred){S.cred=Math.max(0,S.cred-25);log(b[0]+' almost walked. You saw sweat. Credibility -25.','lose');}else log(b[0]+' bought the whole pitch. Concerning.','win');}
  S.cash+=face;S.debt+=payoff;
  log('Sold $'+face+' IOU to '+b[0]+' (owe $'+payoff+')','win');
  /* debts come due randomly */
  if(S.debt>0&&Math.random()<.35){
    if(S.cash>=S.debt){S.cash-=S.debt;log('Paid off $'+S.debt+' of old IOUs. Clean-ish.','win');S.cred=Math.min(100,S.cred+6);S.debt=0;}
    else{S.cred=Math.max(0,S.cred-20);log('An old IOU came due and you stalled. Word travels.','lose');}
  }
  if(S.cred<=0){S.over=true;return end('PAPER COLLAPSE','Credibility hit zero on buyer '+(S.i+1)+'. Cash: $'+S.cash+', debts: $'+S.debt+'. Dale is the only one still waving at you.');}
  S.i++;next();
}
function end(t,b){
  S.over=true;
  if(!t){
    const net=S.cash-Math.min(S.debt,S.cash);
    t=net>=300?'PAPER TYCOON':net>=100?'LIQUID, MOSTLY':'TECHNICALLY AFLOAT';
    b='Ten buyers served. Cash $'+S.cash+', outstanding IOUs $'+S.debt+', credibility '+S.cred+'%. Net worth: $'+net+' of other people\'s trust.';
  }
  $('ovT').textContent=t;$('ovB').textContent=b;$('overlay').classList.add('show');
}
$('again').onclick=()=>location.reload();
next();
</script>
</body>
</html>
